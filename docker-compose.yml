# ZNS 索引回收服务：初始 4 个模拟写区（每区 32 个 4 KiB 块，便于演示），
# 1 个保留区用于 GC 周转；数据落在命名卷 zns-data 上，容器重启/被杀后
# 已确认的写入保留，未完成的回收/扩容可重试。
# 区数可在运行期通过 POST /zones/expand 在线扩容（只增不减），
# ZONE_COUNT 仅表示首次建卷时的初始区数，扩容后以数据卷上的已启用区数为准。
services:
  zns-gc:
    build: .
    image: zns-gc-service
    ports:
      - "8000:8000"
    environment:
      DATA_DIR: /data
      ZONE_COUNT: "4"
      ZONE_CAPACITY_BYTES: "131072"   # 128 KiB = 32 块/区，方便在 Swagger 里快速写满
      RESERVED_FREE_ZONES: "1"        # 留一个区周转（扩容新区沿用同一预留数）
      GC_STEP_DELAY_MS: "0"           # 演示搬迁中覆写时可调大（如 200）
      READ_DELAY_MS: "0"
      JOURNAL_CHECKPOINT_OPS: "1024"
      # 扩容崩溃演练钩子（生产保持 0/不设置）：
      # EXPAND_CRASH_DURING_PREPARE: "1"  # 新区准备中途退出（模拟启用前中断）
      # EXPAND_CRASH_BEFORE_COMMIT: "1"   # 新区备妥、启用记录落盘前退出
    volumes:
      - zns-data:/data
    restart: unless-stopped

volumes:
  zns-data:
